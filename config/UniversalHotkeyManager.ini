; Universal Hotkey Manager for Skyrim SE-AE native settings
; Current shortcut: Del
; ToggleKey is a DirectInput (DX) keyboard scan code; hexadecimal and decimal are accepted.
; DX scan-code reference: https://ck.uesp.net/wiki/Input_Script#DXScanCodes
; Examples: F1=0x3B, F2=0x3C, F4=0x3E, F8=0x42, F11=0x57, Delete=0xD3.
; Modifier flags accept either side when the matching *Key value is 0x0.
; Exact modifier codes: LCtrl=0x1D, RCtrl=0x9D, LShift=0x2A, RShift=0x36,
;                       LAlt=0x38, RAlt=0xB8.
